# Pishgaman Business Platform — Nginx Gateway Configuration

upstream portal_backend {
    server portal-backend:3000;
}

# Portal API Gateway
server {
    listen 80;
    server_name portal.pishgaman.ir;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name portal.pishgaman.ir;

    ssl_certificate /etc/letsencrypt/live/pishgaman.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pishgaman.ir/privkey.pem;

    # Portal Frontend (static)
    location / {
        root /usr/share/nginx/html/portal;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Portal API
    location /api/ {
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
    }

    # Swagger docs
    location /api/docs {
        proxy_pass http://portal_backend;
        proxy_set_header Host $host;
    }
}

