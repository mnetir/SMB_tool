version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pishgaman-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pishgaman_portal
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pishgaman-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  portal-backend:
    build:
      context: ../packages/customer-portal/backend
      dockerfile: ../../../ops/portal.Dockerfile
    container_name: pishgaman-portal
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: pishgaman_portal
      JWT_SECRET: ${JWT_SECRET:-pishgaman-portal-jwt-secret-prod}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata: